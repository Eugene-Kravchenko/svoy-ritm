project_id = "svoy-ritm"

[auth]
site_url = "https://eugene-kravchenko.github.io/svoy-ritm/"
additional_redirect_urls = ["https://eugene-kravchenko.github.io/svoy-ritm/"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600
